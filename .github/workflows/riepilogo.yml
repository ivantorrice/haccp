name: Riepilogo coperti
on:
  schedule:
    - cron: "0 18 * * *"
    - cron: "0 19 * * *"
    - cron: "30 10 * * 0"
    - cron: "30 11 * * 0"
  workflow_dispatch:
    inputs:
      force:
        description: "Prova: invia comunque (true/false)"
        default: "false"
jobs:
  notifica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install firebase-admin@12 --no-save
      - run: node .github/scripts/riepilogo.mjs
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          FORCE: ${{ github.event.inputs.force }}
