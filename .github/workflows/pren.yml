name: Nuove prenotazioni
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  notifica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install firebase-admin@12 --no-save
      - run: node .github/scripts/pren.mjs
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
