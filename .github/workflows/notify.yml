
name: Promemoria 18
on:
  schedule:
    - cron: "5 16 * * *"
    - cron: "5 17 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Prova: invia comunque (true/false)"
        default: "false"
jobs:
  notifica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install firebase-admin@12 --no-save
      - run: node .github/scripts/notify.mjs
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          FORCE: ${{ github.event.inputs.force }}
 
