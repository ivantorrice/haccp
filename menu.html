html,body{margin:0;background:#D9CDB8;font-family:Montserrat,"Segoe UI",Arial,sans-serif}
#top{position:sticky;top:0;z-index:5;background:#EDE2D0;padding:8px 12px;display:flex;justify-content:flex-end;box-shadow:0 1px 6px rgba(0,0,0,.18)}

#msg{text-align:center;padding:48px 20px;color:#5b4f3e;font-weight:600}

.cp .cl{position:absolute;left:177px;top:560px;width:440px}
.cp .in{padding:118px 100px 40px}.cp .in.nt{padding-top:70px}
.cp .ct{font-size:26px;font-weight:700;color:#827560;text-align:center;margin-bottom:62px;letter-spacing:.01em}
.cp .cs{font-size:15px;font-weight:700;color:#827560;margin:34px 0 28px;text-transform:uppercase}
.cp .ci{display:flex;justify-content:space-between;gap:18px;margin:0 0 20px}.cp .l{flex:1}
.cp .n{font-weight:700;font-size:16px;line-height:1.3}.cp .n sup{font-size:8px;margin-left:10px;vertical-align:top;position:relative;top:-2px}
.cp .d{font-weight:700;font-size:13.5px;line-height:1.35;white-space:pre-line;max-width:74%;margin-top:2px}
.cp .p{font-weight:700;font-size:16px;white-space:nowrap;text-align:right}
.cp.fit .ct{font-size:24px;margin-bottom:42px}.cp.fit .in{padding-top:96px}.cp.fit .in.nt{padding-top:60px}
.cp.fit .ci{margin-bottom:11px}.cp.fit .n{font-size:12.5px}.cp.fit .d{font-size:12.5px;max-width:80%}.cp.fit .p{font-size:12.5px}.cp.fit .cs{margin:26px 0 20px}
.cp.tx .in{padding-top:56px}.cp .tt{text-align:center;font-weight:700;font-size:16px;line-height:1.5;max-width:520px;margin:0 auto}
.cp .tm{text-align:center;font-weight:700;font-size:17px;color:#827560;letter-spacing:.02em;line-height:1.5;margin-top:56px;white-space:pre-line}
.cp.tx .cs{text-align:center;margin-top:150px;margin-bottom:36px}

  const E = (t, p, ...kids) => {
    const e = document.createElement(t);
    if (p) for (const a in p){
      if (a === "text") e.textContent = p[a];
      else if (a === "cls") e.className = p[a];
      else if (a === "on") for (const ev in p.on) e.addEventListener(ev, p.on[ev]);
      else if (a === "value" || a === "checked" || a === "hidden") e[a] = p[a];
      else e.setAttribute(a, p[a]);
    }
    kids.forEach(k => { if (k != null) e.append(k); });
    return e;
  };

  function pageEl(p){
    const d = E("div", {cls: "cp" + (p.fitto ? " fit" : "") + (p.tipo === "testo" ? " tx" : "")});
    if (p.tipo === "cover"){ d.append(E("img", {cls: "cl", src: LOGO, alt: "Vittoria 1926 Osteria Contemporanea"})); return d; }
    const inn = E("div", {cls: "in" + (p.titolo ? "" : " nt")});
    if (p.titolo) inn.append(E("div", {cls: "ct", text: p.titolo}));
    if (p.tipo === "testo"){
      if (p.testo) inn.append(E("div", {cls: "tt", text: p.testo}));
      if (p.motto) inn.append(E("div", {cls: "tm", text: p.motto.split(/\s+/).join("\n")}));
    }
    (p.sezioni || []).forEach(s => {
      if (s.nome) inn.append(E("div", {cls: "cs", text: s.nome}));
      (s.voci || []).forEach(v => {
        const n = E("div", {cls: "n"}, document.createTextNode(v.n || ""));
        if (v.a) n.append(E("sup", {cls: "a", text: v.a}));
        const l = E("div", {cls: "l"}, n, v.d ? E("div", {cls: "d", text: v.d}) : null);
        inn.append(E("div", {cls: "ci"}, l, E("div", {cls: "p", text: v.p || ""})));
      });
    });
    d.append(inn); return d;
  }

const CACHE = "menu-pubblico-v1";
const DT = [["sg", "SG", "Senza glutine (celiaci)"], ["v", "V", "Vegetariano"], ["vg", "VG", "Vegano"]];
function show(carta){
  const box = document.getElementById("pages"); box.textContent = "";
  const head = E("div", {cls: "mh"}); head.append(E("img", {src: LOGO, alt: "Vittoria 1926 Osteria Contemporanea"}), E("a", {cls: "an", href: "#allergeni", text: "Elenco degli allergeni"})); box.append(head);
  // raggruppa: le sezioni senza titolo continuano la precedente
  const secs = [];
  carta.forEach(p => {
    if (p.tipo === "cover") return;
    if (p.tipo === "testo"){ secs.push({t: (p.sezioni && p.sezioni[0] && p.sezioni[0].nome) || p.titolo || "", testo: p.testo, motto: p.motto, voci: ((p.sezioni || [])[0] || {voci: []}).voci, g: ""}); return; }
    (p.sezioni || []).forEach(s => {
      if (!s.nome && secs.length && !secs[secs.length - 1].testo){ secs[secs.length - 1].voci = secs[secs.length - 1].voci.concat(s.voci || []); return; }
      secs.push({t: s.nome || p.titolo || "", voci: (s.voci || []).slice(), g: p.titolo || ""});
    });
  });
  const nav = E("div", {cls: "nav"}), main = E("div", {cls: "mm"});
  let lastG = null;
  secs.forEach((s, k) => {
    const id = "s" + k; if (s.t) nav.append(E("a", {href: "#" + id, text: s.t}));
    if (s.g && s.g !== lastG && s.g !== s.t) main.append(E("div", {cls: "mg", text: s.g}));
    lastG = s.g;
    const sec = E("section", {cls: "ms", id}); if (s.t) sec.append(E("h2", {text: s.t}));
    if (s.testo) sec.append(E("div", {cls: "mt", text: s.testo}));
    if (s.motto) sec.append(E("div", {cls: "mq", text: s.motto.split(/\s+/).join("\n")}));
    s.voci.forEach(v => {
      const n = E("div", {cls: "n"}, document.createTextNode(v.n || "")); if (v.a) n.append(E("sup", {text: v.a}));
      { const f = v.dt || []; DT.filter(x => f.includes(x[0]) && !(x[0] === "v" && f.includes("vg"))).forEach(x => n.append(E("span", {cls: "dt", text: x[1]}))); }
      sec.append(E("div", {cls: "mi"}, E("div", {cls: "l"}, n, v.d ? E("div", {cls: "d", text: v.d}) : null), E("div", {cls: "p", text: v.p || ""})));
    });
    main.append(sec);
  });
  const ALL = ["Cereali contenenti glutine","Crostacei","Uova","Pesce","Arachidi","Soia","Latte","Frutta a guscio","Sedano","Senape","Sesamo","Anidride solforosa e solfiti","Lupini","Molluschi"];
  const al = E("section", {cls: "al ms", id: "allergeni"}); al.append(E("h2", {text: "Allergeni"}), E("p", {text: "I numeri accanto ai piatti indicano gli allergeni presenti. Per intolleranze o allergie chiedi pure al nostro personale."}));
  const lg = E("div", {cls: "leg"}); DT.forEach(x => lg.append(E("span", {}, E("span", {cls: "dt", text: x[1]}), document.createTextNode(x[2])))); al.append(E("p", {text: "Piatti adatti a una dieta particolare:"}), lg);
  const ul = E("ul"); ALL.forEach((t, i) => ul.append(E("li", {}, E("b", {text: String(i + 1)}), document.createTextNode(t)))); al.append(ul);
  main.append(al); nav.append(E("a", {href: "#allergeni", text: "Allergeni"}));
  if (nav.children.length > 1) box.append(nav);
  box.append(main, E("div", {cls: "mf", text: "Vittoria 1926 Osteria Contemporanea"}));
  document.getElementById("msg").hidden = true;
}
try { const c = JSON.parse(localStorage.getItem(CACHE) || "null"); if (Array.isArray(c) && c.length) show(c); } catch(e){}
(async () => {
  try {
    const V = "12.0.0", B = "https://www.gstatic.com/firebasejs/" + V + "/";
    const {initializeApp} = await import(B + "firebase-app.js");
    const {getFirestore, doc, getDoc} = await import(B + "firebase-firestore.js");
    const snap = await getDoc(doc(getFirestore(initializeApp(FB_CFG)), "public", "carta"));
    if (!snap.exists()){ if (!document.getElementById("pages").childNodes.length) document.getElementById("msg").textContent = "Il menù non è ancora stato pubblicato."; return; }
    const carta = JSON.parse(snap.data().v);
    try { localStorage.setItem(CACHE, JSON.stringify(carta)); } catch(e){}
    show(carta);
  } catch(e){ if (!document.getElementById("pages").childNodes.length){ document.getElementById("msg").textContent = "Non riesco a caricare il menù. Controlla la connessione e riprova."; } }
})();
